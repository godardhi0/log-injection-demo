{% extends "base.html" %}
{% block content %}
  <h2>{{ titre }}</h2>
  <form method="post">
    <p><input name="username" placeholder="Nom d'utilisateur"></p>
    <p><input name="password" type="password" placeholder="Mot de passe"></p>
    <p><button type="submit">Se connecter</button></p>
  </form>
  <p class="error">{{ message }}</p>
{% endblock %}
